plugins {
    id 'com.android.application'
}

// Release signing: reads from keystore.properties (gitignored, never committed).
// Safe if that file doesn't exist yet -- release builds just won't be signed
// until you create it (see keystore.properties.example + the README for how
// to generate a real keystore). This never affects debug builds either way.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.fastvpnn.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.fastvpnn.app"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "1.0.5"
        vectorDrawables { useSupportLibrary true }

        // Baked into every build -- every user of the published app automatically
        // uses this backend with zero setup on their end. Update this one line
        // whenever you change which server is your "brain".
        buildConfigField "String", "DEFAULT_BACKEND_API_URL", "\"https://api.fastvpnn.pp.ua\""

        // The "Go Premium" crown + banner from the new design. There is no paid tier or
        // billing in the app yet, so they stay hidden. Flip to true once Premium really exists.
        buildConfigField "boolean", "SHOW_PREMIUM", "false"

        // ---- Ads: Yandex Mobile Ads SDK (AdMob, Start.io and other networks are mediation partners inside Yandex) ----
        // Ad unit IDs (banner / native / interstitial) are in app/src/main/java/com/fastvpnn/app/ads/AdConfig.kt.
        // Your AdMob App ID (ca-app-pub-xxxxxxxxxxxxxxxx~yyyyyyyyyy). The Google SDK crashes at start-up without a
        // valid ID, so this is Google's public SAMPLE ID until you paste your own -- REPLACE IT.
        manifestPlaceholders.put("admobAppId", "ca-app-pub-3940256099942544~3347511713")

    }

    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // REAL ads in the release build you publish. Flip to "true" to ship a release build
            // that still shows only Yandex demo ads (e.g. for a final QA pass).
            buildConfigField "boolean", "USE_TEST_ADS", "false"
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            // Fixes the Play Console warning "contains native code, and you've
            // not uploaded debug symbols" -- the WireGuard tunnel library ships
            // native .so files. FULL bundles complete debug symbols into the
            // AAB automatically so Play Console can symbolicate native crashes/ANRs.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            // Debug builds ALWAYS use the Yandex demo banner.
            buildConfigField "boolean", "USE_TEST_ADS", "true"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}


configurations.configureEach {
    // Keep Unity Ads out of the app (the all-in-one Yandex bundle would otherwise bring its SDK + adapter along).
    exclude group: 'com.unity3d.ads'
    exclude group: 'com.yandex.ads.mediation', module: 'mobileads-unityads'
}

dependencies {
    // Removed as unused (no code or layout referenced them): constraintlayout, cardview, coordinatorlayout,
    // lifecycle-livedata-ktx, gson. Material already brings in whatever it needs transitively.
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    // Stable as of 1.1.0 (was pinned to a years-old 1.1.0-alpha06). Note: this
    // release also deprecates EncryptedSharedPreferences/MasterKey in favor of
    // DataStore + Tink -- the deprecated APIs are still fully functional here,
    // but a future migration should account for migrating already-stored keys.
    implementation 'androidx.security:security-crypto:1.1.0'

    // Official WireGuard userspace backend for Android
    implementation 'com.wireguard.android:tunnel:1.0.20260102'

    // Ads: Yandex Mobile Ads SDK 8 with ALL Yandex Mediation adapters in one artifact (needs AGP 8.7+, minSdk 21+,
    // compileSdk 35+ -- all met). One banner. Any network you add to the banner in the Yandex dashboard (AdMob,
    // Start.io, AppLovin, Mintegral, Pangle, Chartboost, InMobi, Liftoff, ...) then works with no app update.
    // It pulls in com.yandex.android:mobileads 8.6.0 itself. Unity Ads is stripped out again in the
    // configurations block below, so Unity stays out of the app even though this bundle contains an adapter for it.
    implementation 'com.yandex.android:mobileads-mediation:8.6.0.0'

    // Networking (backend API + ping)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
}
