org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Faster builds: independent modules in parallel + reuse task outputs between builds
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Optimized resource shrinking (R8 also shrinks resources). Default-on in AGP 9;
# stated explicitly so the Play Console recommendation stays satisfied.
android.r8.optimizedResourceShrinking=true
